openapi: 3.0.3
info:
  title: 'API publique DemarchesTchad'
  description: 'Données ouvertes du guide indépendant DemarchesTchad : démarches administratives au Tchad (pièces, coûts, délais, lieux), villes et bureaux, parcours de vie, diaspora et calendrier administratif.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Démarches
    description: ''
  -
    name: Catégories
    description: ''
  -
    name: Recherche
    description: ''
  -
    name: 'Villes et bureaux'
    description: ''
  -
    name: 'Parcours de vie'
    description: ''
  -
    name: Diaspora
    description: ''
  -
    name: Calendrier
    description: ''
  -
    name: Communauté
    description: ''
paths:
  /api/v1/demarches:
    get:
      summary: 'Lister les démarches'
      operationId: listerLesDmarches
      description: 'Liste paginée des fiches publiées, avec recherche (synonymes compris), filtres et tri.'
      parameters:
        -
          in: query
          name: q
          description: 'Mot-clé recherché dans le titre, le résumé, la description, l’institution et le lieu (alias : search).'
          example: passeport
          required: false
          schema:
            type: string
            description: 'Mot-clé recherché dans le titre, le résumé, la description, l’institution et le lieu (alias : search).'
            example: passeport
        -
          in: query
          name: categorie
          description: 'Slug ou identifiant de catégorie (alias : category).'
          example: identite
          required: false
          schema:
            type: string
            description: 'Slug ou identifiant de catégorie (alias : category).'
            example: identite
        -
          in: query
          name: is_online
          description: 'Seulement les démarches faisables en ligne (true) ou sur place (false).'
          example: false
          required: false
          schema:
            type: boolean
            description: 'Seulement les démarches faisables en ligne (true) ou sur place (false).'
            example: false
        -
          in: query
          name: sort
          description: 'Tri : relevance (par défaut avec q), views (par défaut sans q), title, recent.'
          example: views
          required: false
          schema:
            type: string
            description: 'Tri : relevance (par défaut avec q), views (par défaut sans q), title, recent.'
            example: views
        -
          in: query
          name: per_page
          description: 'Fiches par page, de 1 à 50 (15 par défaut).'
          example: 15
          required: false
          schema:
            type: integer
            description: 'Fiches par page, de 1 à 50 (15 par défaut).'
            example: 15
        -
          in: query
          name: page
          description: 'Numéro de page.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Numéro de page.'
            example: 1
        -
          in: query
          name: lang
          description: 'Langue du contenu : fr (par défaut), en ou ar.'
          example: fr
          required: false
          schema:
            type: string
            description: 'Langue du contenu : fr (par défaut), en ou ar.'
            example: fr
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data: []
                  links:
                    first: 'http://localhost:8000/api/v1/demarches?page=1'
                    last: 'http://localhost:8000/api/v1/demarches?page=1'
