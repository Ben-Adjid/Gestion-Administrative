    get:
      summary: 'Ajouter une date à son agenda'
      operationId: ajouterUneDateSonAgenda
      description: 'Fichier iCalendar (.ics). Une date limite reçoit un rappel 3 jours avant.'
      parameters:
        -
          in: query
          name: lang
          description: 'Langue des textes : fr (par défaut), en ou ar.'
          example: fr
          required: false
          schema:
            type: string
            description: 'Langue des textes : fr (par défaut), en ou ar.'
            example: fr
      responses:
        200:
          description: 'Fichier .ics'
          content:
            text/plain:
              schema:
                type: string
                example: 'BEGIN:VCALENDAR'
